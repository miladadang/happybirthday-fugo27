<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>FUGO / 27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Manrope:wght@400;500;700&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --ink:#0b0b0b; --acc:#6d1a2b; --acc-soft:#f3e6e9; --mute:#8a8284; --line:#e9e4e5;
  --disp:'Unbounded','Manrope',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#efeaea;color:var(--ink);font-family:var(--body);overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center}
#app{position:relative;width:100%;height:100dvh;max-width:460px;background:var(--bg);overflow:hidden}
@media(min-width:520px){#app{height:min(900px,96dvh);border-radius:36px;box-shadow:0 30px 80px rgba(60,10,20,.18)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* progress */
#bar{position:absolute;top:0;left:0;right:0;display:flex;gap:2px;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;z-index:20;pointer-events:none;opacity:0;transition:opacity .4s}
#bar.on{opacity:1}
#bar i{flex:1;height:2px;border-radius:2px;background:rgba(0,0,0,.13);overflow:hidden;position:relative}
#bar i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .35s}
#bar i.done::after{transform:scaleX(1)}
#app.dark #bar i{background:rgba(255,255,255,.2)}
#app.dark #bar i::after{background:#fff}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 44px) 26px calc(env(safe-area-inset-bottom) + 28px);overflow-y:auto;overflow-x:hidden;background:var(--bg);animation:enter .5s cubic-bezier(.2,.8,.2,1) both}
.screen.back{animation-name:enterBack}
@keyframes enter{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes enterBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.screen.dark{background:var(--ink);color:#fff}
.inner{margin:auto 0;display:flex;flex-direction:column;gap:18px;width:100%}
.inner.top{margin-top:8px}

.tag{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:10px}
.tag::before{content:"";width:22px;height:1px;background:currentColor}
.dark .tag{color:#d99aa8}
h1,h2{font-family:var(--disp);font-weight:800;line-height:1.02;letter-spacing:-.03em;text-transform:uppercase}
h2{font-size:clamp(27px,8.4vw,36px)}
.huge{font-size:clamp(70px,25vw,112px);line-height:.88;letter-spacing:-.06em}
p{font-size:clamp(17px,4.9vw,20px);line-height:1.45;font-weight:500}
p.lead{font-size:clamp(20px,5.8vw,24px);line-height:1.3;font-weight:700;letter-spacing:-.01em}
.mute{color:var(--mute)}
.acc{color:var(--acc)}
.dark .mute{color:#8f8789}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.sp{height:6px}
.big27{font-size:clamp(110px,40vw,170px)}
.row{display:flex;align-items:center;gap:14px}
h1.huge,.huge{font-family:var(--disp);font-weight:800;text-transform:uppercase}

.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;letter-spacing:.01em;transition:transform .15s,background .2s}
.pill:active{transform:scale(.95)}
.pill.acc-bg{background:var(--acc)}
.pill.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.dark .pill{background:#fff;color:var(--ink)}
.dark .pill.acc-bg{background:var(--acc);color:#fff}
.chip{display:inline-block;padding:8px 14px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:14px}

/* staggered reveal */
.r{opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* gate */
#gate{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:22px;padding:30px 28px;transition:opacity .5s,transform .5s}
#gate.gone{opacity:0;transform:scale(1.04);pointer-events:none}
#gate .brand{font-family:var(--disp);font-weight:800;font-size:clamp(54px,18vw,80px);line-height:.9;letter-spacing:-.05em}
#gate .brand span{color:var(--acc)}
.pin{display:flex;gap:12px}
.pin input{width:100%;height:64px;border-radius:999px;border:1.5px solid var(--ink);padding:0 26px;font-family:var(--disp);font-size:22px;letter-spacing:.3em;background:transparent;outline:none;text-align:center}
.pin input:focus{border-color:var(--acc)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#hint{min-height:20px;font-size:14px;color:var(--mute)}

/* tracker */
.track{position:relative;padding:22px 18px;border-radius:26px;background:var(--acc-soft)}
.track .cities{display:flex;justify-content:space-between;font-family:var(--disp);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.track .rail{position:relative;height:30px;margin:12px 4px 10px}
.track .rail::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed rgba(109,26,43,.35)}
.track .rail b{position:absolute;top:50%;left:0;height:2px;background:var(--acc);width:0;animation:go 3.2s .8s cubic-bezier(.5,0,.2,1) forwards}
.track .box{position:absolute;top:0;left:0;font-size:22px;animation:gobox 3.2s .8s cubic-bezier(.5,0,.2,1) forwards;transform:translateX(0)}
@keyframes go{to{width:62%}}
@keyframes gobox{to{left:calc(62% - 12px)}}
.track .dot{position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--acc)}
.track .dot.a{left:-4px}.track .dot.b{right:-4px;background:#fff;box-shadow:inset 0 0 0 2px var(--acc)}
.track .st{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.live{display:inline-flex;align-items:center;gap:7px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.popper{width:84px;height:84px;border-radius:50%;background:var(--ink);font-size:38px;display:grid;place-items:center;align-self:flex-start;transition:transform .2s}
.popper:active{transform:scale(.88) rotate(-14deg)}

/* lists */
.list{display:flex;flex-direction:column}
.list li{list-style:none;display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:clamp(16px,4.6vw,19px)}
.list li span{font-family:var(--disp);font-size:11px;color:var(--acc);min-width:24px}
.list li.tired{color:var(--mute);font-weight:500;border-bottom:0}
.stickers{display:flex;flex-wrap:wrap;gap:8px}
.stickers span{padding:9px 14px;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;opacity:0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
.stickers span:nth-child(3n+1){transform:rotate(-3deg)}
.stickers span:nth-child(3n+2){background:var(--ink)}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1}}
.quals{display:flex;flex-direction:column;gap:6px}
.quals div{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(20px,6.4vw,28px);letter-spacing:-.03em}
.quals div em{font-style:normal;color:var(--acc)}

/* cat */
.cat{font-size:92px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.load{height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.load i{display:block;height:100%;width:0;background:var(--acc);border-radius:999px;animation:stuck 4.5s infinite}
@keyframes stuck{0%{width:0}20%{width:6%}30%{width:6%}45%{width:11%}60%{width:3%}100%{width:3%}}
.code{font-family:var(--disp);font-size:12px;letter-spacing:.06em}

/* forecast */
.fc{display:flex;flex-direction:column}
.fc div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:clamp(16px,4.7vw,19px)}
.fc div b{font-family:var(--disp);font-size:13px;color:var(--acc);white-space:nowrap}
.fc .up{display:inline-block;animation:upd 1.6s ease-in-out infinite}
@keyframes upd{50%{transform:translateY(-4px)}}

/* tarot */
.tw{align-self:center}
.tarot{width:min(62vw,240px);aspect-ratio:2/3.3;perspective:1000px}
.tarot .c{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.3,1.1,.4,1);transform-style:preserve-3d}
.tarot.flip .c{transform:rotateY(180deg)}
.tarot .f{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}
.tarot .back{background:var(--acc);color:#fff;box-shadow:inset 0 0 0 6px var(--acc),inset 0 0 0 7.5px rgba(255,255,255,.5)}
.tarot .back .st{font-size:64px;line-height:1}
.tarot .back small{font-family:var(--disp);font-size:10px;letter-spacing:.2em;margin-top:14px;opacity:.85}
.tarot .front{background:#fff;color:var(--ink);transform:rotateY(180deg);box-shadow:inset 0 0 0 1.5px var(--ink);gap:10px}
.tarot .front .n{font-family:var(--disp);font-size:11px;letter-spacing:.2em;color:var(--acc)}
.tarot .front .t{font-family:var(--disp);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
.tarot .front .s{font-size:44px}
.tarot:not(.flip){animation:wob 2.8s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(2.5deg) translateY(-5px)}}

/* polaroid slider */
.screen.gscreen{padding-left:0;padding-right:0}
.gscreen .tag,.gscreen h2,.gscreen .gnav{margin-left:26px;margin-right:26px}
.slider{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:18px 11% 26px;margin:0;-webkit-overflow-scrolling:touch}
.slider::-webkit-scrollbar{display:none}
.slide{flex:0 0 78%;scroll-snap-align:center;display:flex;justify-content:center;align-items:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s;transform:rotate(var(--rot,0deg)) scale(.86);opacity:.55}
.slide.on{transform:rotate(0) scale(1);opacity:1}
.polaroid{background:#fff;padding:12px 12px 0;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 14px 34px rgba(60,10,20,.2);display:flex;flex-direction:column;max-width:100%}
.polaroid img{display:block;max-width:100%;max-height:min(50dvh,430px);width:auto;height:auto;background:var(--acc-soft);border-radius:2px}
.polaroid figcaption{font-family:'Caveat','Manrope',cursive;font-size:24px;color:#2a2a2a;text-align:center;padding:10px 0 14px;min-height:52px;line-height:1.1}
.gnav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gnav .cnt{font-family:var(--disp);font-size:13px;letter-spacing:.1em}
.gnav .cnt b{color:var(--acc)}
.rb{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;font-size:20px;display:grid;place-items:center;transition:transform .15s}
.rb:active{transform:scale(.9)}
.rb.l{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}

iframe.ym{width:100%;height:244px;border:0;border-radius:22px;background:var(--acc-soft)}

.letter p{margin-bottom:12px}
.sign{font-family:var(--disp);font-weight:800;font-size:22px;color:var(--acc);text-transform:uppercase;letter-spacing:-.02em}

#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.hintnav{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);text-align:center;font-size:11px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;z-index:10;pointer-events:none;opacity:0;transition:opacity .4s}
.hintnav.on{opacity:.9}

/* ===== v2 ===== */
.screen.center{text-align:center}
.screen.center .inner{align-items:center;text-align:center}
.screen.center .tag{justify-content:center}
.screen.center .pill{align-self:center}
.fx-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.fl{position:absolute;bottom:-50px;animation:floatup var(--d) ease-in forwards;line-height:1}
.fl.txt{font-family:var(--disp);font-weight:800;color:var(--acc);font-size:20px;bottom:30%}
@keyframes floatup{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(var(--x),-110vh) rotate(var(--rot));opacity:0}}
.fall{position:absolute;top:-50px;animation:fallDown var(--d) linear forwards;line-height:1}
@keyframes fallDown{to{transform:translateY(115vh) rotate(var(--rot))}}
.polsm{display:flex;justify-content:center}
.polsm .polaroid img{max-height:min(34dvh,300px)}
.polsm .polaroid figcaption{min-height:30px;padding:6px 0 8px}
.vrow{display:flex;align-items:center;gap:16px}
.vrow h2{font-size:clamp(20px,6.4vw,27px)}
.vinyl{width:96px;flex:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.spin{transform-origin:60px 60px;animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{width:100%;height:90px;overflow:visible}
.wp{fill:none;stroke:var(--acc);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s .5s ease-out forwards}
.wd{fill:var(--acc);opacity:0;animation:pop .4s 3.1s forwards,pulse 1.4s 3.5s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{r:8}}
.wlab{display:flex;justify-content:space-between;font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:-8px}
.scene{width:100%;border-radius:18px;display:block}
.beamL{transform-origin:70px 0;animation:sway 3.4s ease-in-out infinite}
.beamR{transform-origin:250px 0;animation:sway 3.4s ease-in-out infinite reverse}
@keyframes sway{50%{transform:rotate(9deg)}}
.head{animation:hop .9s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.memebox{width:100%}
.memeimg{width:100%;border-radius:14px;display:block}
.meme{border:2px solid var(--ink);border-radius:14px;overflow:hidden}
.mrow{display:flex;align-items:center;min-height:92px}
.mrow.no{background:#f4f1f1}
.mrow.yes{background:#fff;border-top:2px solid var(--ink)}
.mface{width:92px;flex:none;align-self:stretch;display:grid;place-items:center;font-size:48px;border-right:2px solid var(--ink)}
.mrow.no .mface{background:#e9dfe1}
.mrow.yes .mface{background:var(--acc-soft);animation:bob 2.4s ease-in-out infinite}
.mtxt{padding:10px 14px;font-family:var(--disp);font-weight:800;font-size:15px;text-transform:uppercase;line-height:1.15}
.mrow.yes .mtxt{color:var(--acc)}
.crane{width:100%;height:auto;display:block;overflow:visible}
.caticon{width:104px;display:block;animation:bob 2.4s ease-in-out infinite}
.eyes{transform-origin:50px 55px;animation:blinkEye 4s infinite}
@keyframes blinkEye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.thanks{background:var(--acc);color:#fff;border-radius:26px;padding:26px 22px;text-align:center;box-shadow:0 14px 34px rgba(109,26,43,.3)}
.th-t{font-family:var(--disp);font-weight:800;font-size:clamp(30px,10vw,42px);text-transform:uppercase;letter-spacing:-.03em}
.th-s{font-size:clamp(18px,5.2vw,22px);font-weight:700;line-height:1.3;margin-top:8px}
.th-h{font-size:30px;margin-top:10px;animation:bob 2s ease-in-out infinite}
.trail{width:100%;display:block;overflow:visible}
.tpath{fill:none;stroke:var(--acc);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.2s .6s ease-in-out forwards}
.ms{opacity:0;animation:pop .5s forwards}
.ms circle{fill:#fff;stroke:var(--ink);stroke-width:3}
.ms text{font-family:var(--disp);font-size:10px;font-weight:800;fill:var(--ink);text-transform:uppercase}
.ms.me circle{fill:var(--acc);stroke:var(--acc)}
.ms.me text{fill:var(--acc)}
.tarot .front .cn{font-family:var(--disp);font-weight:800;font-size:76px;line-height:1;color:var(--acc)}
.day{display:flex;align-items:center;gap:18px}
.sprout{width:96px;flex:none}
.sprout .stem{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .4s forwards}
.sprout .leaf{transform-box:fill-box;transform-origin:bottom right;transform:scale(0);animation:grow .6s cubic-bezier(.3,1.6,.5,1) forwards}
.sprout .l1{animation-delay:1.2s;transform-origin:right bottom}.sprout .l2{animation-delay:1.5s;transform-origin:left bottom}.sprout .l3{animation-delay:1.8s;transform-origin:center bottom}
@keyframes grow{to{transform:scale(1)}}
.dcount{flex:1}
.dn{font-family:var(--disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.dn b{font-size:34px;color:var(--acc)}
.dbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.dbar i{display:block;height:100%;width:3%;background:var(--acc);border-radius:99px;animation:dbar 2.4s .6s ease-out forwards}
@keyframes dbar{from{width:0}to{width:3%}}
.dsub{font-size:13px;color:var(--mute);font-weight:600}
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.bar span{font-weight:700;font-size:15px}
.bar b{font-family:var(--disp);font-size:11px;color:var(--acc);text-transform:uppercase}
.bar div{grid-column:1/-1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(90deg,var(--acc) 0 12px,#8c2a3e 12px 14px);animation:fillbar 1.4s forwards cubic-bezier(.3,.9,.3,1)}
@keyframes fillbar{to{width:100%}}
.envwrap{display:flex;flex-direction:column;align-items:center;margin:auto 0}
.env{position:relative;width:min(78vw,300px);aspect-ratio:3/2;cursor:pointer;animation:bob 2.6s ease-in-out infinite}
.ebody{position:absolute;inset:0;background:var(--acc-soft);border-radius:8px;box-shadow:0 14px 34px rgba(60,10,20,.2),inset 0 0 0 1.5px var(--acc)}
.eflap{position:absolute;left:0;right:0;top:0;height:60%;background:#e8cfd5;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:3;transition:transform .7s}
.env.open{animation:none}
.env.open .eflap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--acc);display:grid;place-items:center;z-index:4;font-size:20px;transition:opacity .4s}
.env.open .seal{opacity:0}
.eto{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-family:'Caveat',cursive;font-size:24px;color:var(--acc);z-index:2}
.paper{background:#fffdf8;border-radius:6px;padding:26px 22px 22px 22px;margin:6px 0 0;box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 40px rgba(60,10,20,.16);background-image:repeating-linear-gradient(transparent 0 33px,#efe4e6 33px 34px);font-family:'Caveat','Manrope',cursive;animation:rise .7s both}
.paper p{font-family:'Caveat',cursive;font-size:25px;line-height:34px;font-weight:600;margin:0 0 34px;color:#1c1c1c}
.paper p:last-child{margin-bottom:0}
.paper .psign{color:var(--acc);font-size:28px}
.screen:has(.paper) .pill{margin-top:20px}

.gr{width:100%;display:block}
.gt{font-family:var(--disp);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.gf{animation:fade .6s .3s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.passhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--disp);font-size:12px;font-weight:800;text-transform:uppercase}
.passhead span{color:var(--acc);font-size:10px;text-align:right}
.tickets{display:flex;flex-direction:column;gap:14px}
.tk{position:relative;background:#fff;border:1.5px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 8px 20px rgba(60,10,20,.1);transition:opacity .4s,background .3s}
.tk::before,.tk::after{content:"";position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink);z-index:2}
.tk::before{left:-10px}.tk::after{right:-10px}
.tk-top{display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;border-left:6px solid var(--acc)}
.tk-e{font-size:32px;flex:none}
.tk-n{font-family:var(--disp);font-size:10px;letter-spacing:.1em;color:var(--acc);font-weight:800}
.tk-h{font-weight:800;font-size:17px;line-height:1.2;margin-top:3px}
.tk-a{margin-left:auto;font-weight:800;color:var(--acc);transition:transform .3s}
.tk.open .tk-a{transform:rotate(180deg)}
.tk-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}
.tk.open .tk-body{grid-template-rows:1fr}
.tk-in{overflow:hidden;border-top:2px dashed var(--line);margin:0 20px}
.tk-in p{font-size:16px;padding-top:14px}
.tk-in .pill{margin:12px 0 18px;padding:12px 22px;font-size:14px}
.tk-stamp{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:22px;text-transform:uppercase;color:var(--acc);letter-spacing:.06em;opacity:0;transform:rotate(-8deg) scale(2);pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.3,1.4,.5,1)}
.tk-stamp::after{content:"";position:absolute;inset:26% 8%;border:3px solid var(--acc);border-radius:10px}
.tk.used{background:var(--acc-soft)}
.tk.used .tk-top{opacity:.45}
.tk.used .tk-stamp{opacity:1;transform:rotate(-8deg) scale(1)}

  const svg = el.querySelector('#crane');
  const X0 = 110, XS = 250, G = 232, BH = 26, BW = 58, TOP = 51;
  const tr = svg.querySelector('#trolley'), cable = svg.querySelector('#cable'), hook = svg.querySelector('#hook'), sling = svg.querySelector('#sling');
  const blocks = [...svg.querySelectorAll('.blk')];
  const clamp = v => Math.max(0, Math.min(1, v)), sm = v => { v = clamp(v); return v * v * (3 - 2 * v); };
  const seg = (u, a, b) => sm((u - a) / (b - a)), lerp = (a, b, t) => a + (b - a) * t;
  const D = 3.6, T = D * 3 + 1.8, Lsrc = G - BH - 8 - TOP, Lend = k => G - BH * (k + 1) - 8 - TOP;
  let raf; const t0 = performance.now();
  const frame = (now) => {
    const t = ((now - t0) / 1000) % T, hold = t >= D * 3, k = Math.min(2, Math.floor(t / D)), u = t - k * D;
    let x, L, carry = false;
    if (hold) { x = X0; L = lerp(Lend(2), 40, seg(t - D * 3, 0, .9)); }
    else {
      const Lp = k === 0 ? 40 : Lend(k - 1);
      if (u < .7) { x = lerp(X0, XS, seg(u, 0, .7)); L = lerp(Lp, 40, seg(u, 0, .7)); }
      else if (u < 1.3) { x = XS; L = lerp(40, Lsrc, seg(u, .7, 1.3)); }
      else if (u < 1.6) { x = XS; L = Lsrc; }
      else if (u < 2.1) { x = XS; L = lerp(Lsrc, 40, seg(u, 1.6, 2.1)); carry = true; }
      else if (u < 2.9) { x = lerp(XS, X0, seg(u, 2.1, 2.9)); L = 40; carry = true; }
      else if (u < 3.5) { x = X0; L = lerp(40, Lend(k), seg(u, 2.9, 3.5)); carry = true; }
      else { x = X0; L = Lend(k); }
    }
    tr.setAttribute('transform', `translate(${x} 0)`);
    cable.setAttribute('y2', TOP + L); hook.setAttribute('cy', TOP + L);
    sling.setAttribute('transform', `translate(0 ${TOP + L})`); sling.style.display = carry ? '' : 'none';
    blocks.forEach((b, i) => {
      let cx, ty, vis = true;
      if (hold || i < k) { cx = X0; ty = G - BH * (i + 1); }
      else if (i === k) {
        if (carry) { cx = x; ty = TOP + L + 8; } else if (u >= 3.5) { cx = X0; ty = G - BH * (i + 1); } else { cx = XS; ty = G - BH; }
      } else vis = false;
      b.style.display = vis ? '' : 'none';
      if (vis) b.setAttribute('transform', `translate(${cx - BW / 2} ${ty})`);
    });
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
  return () => cancelAnimationFrame(raf);
}});

  el.className = 'screen' + (back ? ' back' : '') + (s.dark ? ' dark' : '') + (s.cls ? ' ' + s.cls : '');
  let body = s.html;
  if (i >= 0 && s.btn !== false && i < S.length - 1 && !body.includes('data-next'))
    body += `<button class="pill acc-bg r" data-next style="animation-delay:${0.5 + (body.match(/class="[^"]*\br\b/g) || []).length * 0.1}s">${BTN[s.n] || 'Дальше →'}</button>`;
  const inner = i === -1 ? body : `<div class="inner">
      <div class="tag r">${String(s.n).padStart(2, '0')} — ${s.tag}</div>
      ${body}
    </div>`;
  el.innerHTML = inner;
  stage.innerHTML = '';
  stage.appendChild(el);
  app.classList.toggle('dark', !!s.dark);
  document.querySelector('meta[name=theme-color]').content = s.dark ? '#0b0b0b' : '#ffffff';
  bar.classList.toggle('on', i >= 0);
  segs.forEach((g, k) => g.classList.toggle('done', k <= i));
  hn.classList.toggle('on', i === -1 || i === 0);
  if (s.onEnter) { const c = s.onEnter(el); if (typeof c === 'function') cleanup = c; }
  try { localStorage.setItem('fugo27_idx', i); } catch (e) {}
}
const next = () => show(idx + 1);
const prev = () => show(idx - 1, true);

stage.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('[data-pop]')) { confetti(1); return; }
  if (t.closest('[data-next]')) { confetti(.5); next(); return; }
  if (t.closest('button, a, iframe, .tarot, .slider, .gnav, .envwrap, .tk')) return;
  const x = e.clientX - app.getBoundingClientRect().left;
  if (x < app.clientWidth * 0.3) prev(); else next();
});
let tx = 0, ty = 0, inSlider = false;
stage.addEventListener('touchstart', e => { inSlider = !!e.target.closest('.slider'); tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
stage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (!inSlider && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { dx < 0 ? next() : prev(); e.preventDefault(); }
}, { passive: false });
document.addEventListener('keydown', e => {
  if (document.getElementById('gate').classList.contains('gone')) {
    if (e.key === 'ArrowRight' || e.key === ' ') next();
    if (e.key === 'ArrowLeft') prev();
  }
});

/* ============ пароль ============ */
const gate = document.getElementById('gate');
const pin = document.getElementById('pin');
let fails = 0;
function tryPin() {
  if (pin.value.trim() === PASSWORD) {
    gate.classList.add('gone');
    try { sessionStorage.setItem('fugo27_ok', '1'); } catch (e) {}
    show(-1);
  } else {
    fails++;
    pin.value = '';
    pin.classList.remove('shake'); void pin.offsetWidth; pin.classList.add('shake');
    document.getElementById('hint').textContent = fails >= 2 ? 'Подсказка: сколько тебе исполняется 😏' : 'Не то. Попробуй ещё.';
  }
}
document.getElementById('pinForm').addEventListener('submit', e => { e.preventDefault(); tryPin(); });
document.getElementById('pinBtn').addEventListener('click', tryPin);
try { if (sessionStorage.getItem('fugo27_ok')) { gate.classList.add('gone'); show(-1); } } catch (e) {}

/* ============ конфетти ============ */
const cv = document.getElementById('fx');
const cx = cv.getContext('2d');
let parts = [], raf = null;
function fit() { const r = app.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; }
addEventListener('resize', fit); fit();
function confetti(power = 1) {
  fit();
  const W = cv.width, H = cv.height, cols = ['#6d1a2b', '#0b0b0b', '#b84a5f', '#e8b4bc', '#ffffff'];
  const n = Math.round(90 * power);
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 1.6;
    const v = (10 + Math.random() * 16) * devicePixelRatio;
    parts.push({
      x: W / 2 + (Math.random() - .5) * W * .3, y: H * .75,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      w: (6 + Math.random() * 7) * devicePixelRatio, h: (3 + Math.random() * 5) * devicePixelRatio,
      r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: cols[(Math.random() * cols.length) | 0], life: 0
    });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.y < cv.height + 40 && p.life < 220);
  for (const p of parts) {
    p.vy += .55 * devicePixelRatio; p.vx *= .985; p.vy *= .985;
    p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.strokeStyle = 'rgba(0,0,0,.25)'; cx.lineWidth = devicePixelRatio * .6;
    cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    if (p.c === '#ffffff') cx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : null;
}
</script>
</body>
